<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- 소개 캐릭터 3D 장면(아트 토이 인형). 사용법: three.js 저장소를 이 파일 옆 three/ 폴더에 두고 로컬 서버로 연 뒤 캔버스를 저장 -->
<style>html,body{margin:0;background:#9ec3e6}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const Q = new URLSearchParams(location.search);
const W = Number(Q.get('w') || 800), H = Number(Q.get('h') || 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
{ // 파스텔 블루 배경
  const c = document.createElement('canvas'); c.width = 4; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, '#7fb2e6'); gr.addColorStop(1, '#9cc4ec');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.08).texture;
scene.environmentIntensity = 0.55;

const cam = new THREE.PerspectiveCamera(21, W / H, 0.1, 100);
cam.position.set(0, 1.3, 10.4); cam.lookAt(0, 1.0, 0);

// 크고 부드러운 스튜디오 조명
const key = new THREE.DirectionalLight('#fff4ea', 1.6);
key.position.set(-2.4, 4.4, 6); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 16; key.shadow.blurSamples = 25; key.shadow.bias = -0.0006;
Object.assign(key.shadow.camera, { left: -2.6, right: 2.6, top: 3.6, bottom: -1.8, near: 1, far: 20 });
scene.add(key);
const fill = new THREE.DirectionalLight('#eaf2ff', 0.6); fill.position.set(3.5, 1.2, 5); scene.add(fill);
const rim = new THREE.DirectionalLight('#ffffff', 0.9); rim.position.set(1.5, 3, -5); scene.add(rim);
scene.add(new THREE.HemisphereLight('#ffffff', '#cbd9e8', 0.6));

// ---------- 재질 ----------
const skinBase = { roughness: 0.78, sheen: 0.7, sheenColor: new THREE.Color('#ffcab6'), sheenRoughness: 0.7, clearcoat: 0.1, clearcoatRoughness: 0.6, emissive: new THREE.Color('#702816'), emissiveIntensity: 0.06 };
const skinMat = new THREE.MeshPhysicalMaterial({ color: '#ffffff', vertexColors: true, ...skinBase });
const skin = c => new THREE.MeshPhysicalMaterial({ color: c, ...skinBase });
// 부드러운 초콜릿 브라운, 새틴 레진(은은한 투명감)
const hairMat = new THREE.MeshPhysicalMaterial({ color: '#6a3b29', roughness: 0.36, clearcoat: 0.25, clearcoatRoughness: 0.35, sheen: 0.9, sheenColor: new THREE.Color('#c08a6a'), sheenRoughness: 0.45, transmission: 0.28, thickness: 0.5, ior: 1.42, attenuationColor: new THREE.Color('#7a3e22'), attenuationDistance: 0.45, envMapIntensity: 0.6, side: THREE.DoubleSide });
const topMat = new THREE.MeshPhysicalMaterial({ color: '#fbfbfb', roughness: 0.6, sheen: 0.4, sheenColor: new THREE.Color('#ffffff'), clearcoat: 0.1, clearcoatRoughness: 0.5 });

const HEAD = new THREE.Vector3(0, 1.42, 0);
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const gauss = (d, w) => Math.exp(-((d / w) ** 2));
const EYE = [{ x: -0.37, y: -0.15 }, { x: 0.37, y: -0.15 }];

// ---------- 머리(얼굴): 계란형에 가까운 둥근 머리, 아래쪽에 도톰한 볼, 좁은 턱 ----------
function headShape(d) {
  const { x, y, z } = d;
  let r = 1;
  const front = smooth(-0.1, 0.55, z);
  for (const sx of [-1, 1]) r += 0.11 * gauss(Math.hypot((x - sx * 0.52) * 1.1, (y + 0.42) * 1.25), 0.36) * front;   // 도톰한 볼
  const jaw = smooth(-0.5, -1.0, y);
  r *= 1 - 0.09 * jaw * smooth(0.0, 0.7, Math.abs(x) + 0.2 * (1 - front));
  r *= 1 - 0.05 * smooth(-0.7, -1.0, y);                                           // 좁고 둥근 턱
  for (const e of EYE) r -= 0.028 * gauss(Math.hypot(x - e.x * 0.95, y - e.y), 0.2) * front;                          // 눈 주변 얕은 오목함
  r *= 1 + 0.02 * smooth(0.3, 0.9, y);
  return new THREE.Vector3(x * 1.0, y * 1.03, z * 0.98).multiplyScalar(r);
}
const hg = new THREE.SphereGeometry(1, 220, 170);
{
  const p = hg.attributes.position, v = new THREE.Vector3(), col = [];
  const base = new THREE.Color('#f8d3c0'), blush = new THREE.Color('#f29a90'), lid = new THREE.Color('#eab4a0');
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i).normalize(); const s = headShape(v); p.setXYZ(i, s.x, s.y, s.z);
    const c = base.clone();
    if (s.z > 0.2) {
      for (const sx of [-1, 1]) c.lerp(blush, 0.6 * gauss(Math.hypot((s.x - sx * 0.5) / 1.3, s.y + 0.44), 0.2));
      for (const e of EYE) c.lerp(lid, 0.35 * gauss(Math.hypot((s.x - e.x) / 1.2, s.y - e.y - 0.13), 0.1));
    }
    col.push(c.r, c.g, c.b);
  }
  hg.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); hg.computeVertexNormals();
}
const head = new THREE.Mesh(hg, skinMat); head.position.copy(HEAD); head.castShadow = head.receiveShadow = true; scene.add(head);

function dirOf(theta, phi) { return new THREE.Vector3(Math.sin(theta) * Math.sin(phi), Math.cos(theta), Math.sin(theta) * Math.cos(phi)); }
function surfAt(d, off = 0) {
  d = d.clone().normalize(); const p = headShape(d);
  const e = 1e-3, a = Math.abs(d.y) < 0.9 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
  const u = new THREE.Vector3().crossVectors(d, a).normalize(), w = new THREE.Vector3().crossVectors(d, u).normalize();
  const t1 = headShape(d.clone().addScaledVector(u, e).normalize()).sub(p), t2 = headShape(d.clone().addScaledVector(w, e).normalize()).sub(p);
  const n = new THREE.Vector3().crossVectors(t1, t2).normalize(); if (n.dot(d) < 0) n.negate();
  return { p: p.addScaledVector(n, off).add(HEAD), n };
}
function faceAt(x, y, off = 0) { const d = new THREE.Vector3(x, y / 1.03, 0); d.z = Math.sqrt(Math.max(0.02, 1 - d.x * d.x - d.y * d.y)); return surfAt(d, off); }

// ---------- 눈: 부드러운 타원, 크고 따뜻한 갈색 홍채, 유리 같은 반사 ----------
function eyeTex() {
  const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
  const sc = g.createRadialGradient(256, 256, 120, 256, 256, 300); sc.addColorStop(0, '#fbf7f4'); sc.addColorStop(1, '#e9dcd6');
  g.fillStyle = sc; g.fillRect(0, 0, 512, 512);
  const cx = 256, cy = 262, R = 176;
  const ir = g.createRadialGradient(cx, cy + 40, 6, cx, cy, R);
  ir.addColorStop(0, '#c99266'); ir.addColorStop(0.35, '#9a643d'); ir.addColorStop(0.75, '#64391f'); ir.addColorStop(1, '#3c2112');
  g.fillStyle = ir; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
  g.globalAlpha = 0.15; g.strokeStyle = '#e2b385'; g.lineWidth = 3;
  for (let a = 0; a < Math.PI * 2; a += 0.1) { g.beginPath(); g.moveTo(cx + Math.cos(a) * 66, cy + Math.sin(a) * 66); g.lineTo(cx + Math.cos(a) * 160, cy + Math.sin(a) * 160); g.stroke(); }
  g.globalAlpha = 1;
  g.fillStyle = '#26140b'; g.beginPath(); g.arc(cx, cy + 4, 70, 0, Math.PI * 2); g.fill();
  const lo = g.createRadialGradient(cx, cy + 120, 4, cx, cy + 120, 110); lo.addColorStop(0, 'rgba(255,210,165,.55)'); lo.addColorStop(1, 'rgba(255,210,165,0)');
  g.fillStyle = lo; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
  const sh = g.createLinearGradient(0, 60, 0, 220); sh.addColorStop(0, 'rgba(90,50,35,.45)'); sh.addColorStop(1, 'rgba(90,50,35,0)');
  g.fillStyle = sh; g.fillRect(0, 0, 512, 230);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const eyeMat = new THREE.MeshPhysicalMaterial({ map: eyeTex(), roughness: 0.08, clearcoat: 1, clearcoatRoughness: 0.03, envMapIntensity: 0.9 });
for (const e of EYE) {
  const R = 0.27, sx = Math.sign(e.x);
  const at = faceAt(e.x, e.y, 0);
  const out = at.n.clone().lerp(new THREE.Vector3(0, 0, 1), 0.6).normalize();
  const center = at.p.clone().addScaledVector(out, -0.16);
  const g = new THREE.SphereGeometry(R, 96, 64); g.rotateX(Math.PI / 2);
  const p = g.attributes.position, uv = g.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i) / R * 0.5 + 0.5, p.getY(i) / R * 0.5 + 0.5);
  g.scale(1.1, 1.0, 1.0);
  const ball = new THREE.Mesh(g, eyeMat); ball.position.copy(center); ball.lookAt(center.clone().add(out)); ball.rotateZ(sx * 0.05); ball.receiveShadow = true; scene.add(ball);
  const hl = new THREE.Mesh(new THREE.SphereGeometry(0.028, 24, 16), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
  hl.position.copy(center).add(new THREE.Vector3(-0.07, 0.08, R * 0.97)); hl.scale.set(1, 1.15, 0.3); scene.add(hl);
  const hl2 = hl.clone(); hl2.scale.set(0.45, 0.45, 0.2); hl2.position.copy(center).add(new THREE.Vector3(0.06, -0.075, R * 0.98)); scene.add(hl2);
  const lid = new THREE.Mesh(new THREE.SphereGeometry(R * 1.035, 96, 48, 0, Math.PI * 2, 0, Math.PI * 0.32), skin('#f2c5b0'));
  lid.scale.set(1.1, 1, 1); lid.position.copy(center); lid.lookAt(center.clone().add(new THREE.Vector3(0, 1, 0.45)));
  lid.castShadow = true; scene.add(lid);
}
{ const n = faceAt(0, -0.43, -0.035); const m = new THREE.Mesh(new THREE.SphereGeometry(0.06, 48, 32), skin('#f6cab6')); m.scale.set(1.0, 0.75, 0.8); m.position.copy(n.p); m.castShadow = true; scene.add(m); }
{ const lip = new THREE.MeshPhysicalMaterial({ color: '#d98276', roughness: 0.55, sheen: 0.5, sheenColor: new THREE.Color('#ffc3b4') });
  const m = faceAt(0, -0.6, -0.025);
  for (const sx of [-1, 1]) { const u = new THREE.Mesh(new THREE.SphereGeometry(0.05, 48, 32), lip); u.scale.set(0.9, 0.38, 0.5); u.position.copy(m.p).add(new THREE.Vector3(sx * 0.028, 0.012, 0)); scene.add(u); }
  const l = new THREE.Mesh(new THREE.SphereGeometry(0.05, 48, 32), lip); l.scale.set(1.15, 0.45, 0.55); l.position.copy(m.p).add(new THREE.Vector3(0, -0.02, 0.004)); scene.add(l); }
for (const sx of [-1, 1]) {
  const e = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 32), skin('#f4c6b0'));
  e.scale.set(0.12, 0.2, 0.1); e.position.set(sx * 1.0, HEAD.y - 0.12, -0.02); e.rotation.y = sx * 0.5; e.castShadow = e.receiveShadow = true; scene.add(e);
  const inner = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), skin('#eeb4a0')); inner.scale.set(0.06, 0.12, 0.05); inner.position.set(sx * 1.05, HEAD.y - 0.12, 0.03); scene.add(inner);
}

// ---------- 목·어깨·흰 민소매 ----------
function lathe(prof, zs, mat, y = 0) {
  const g = new THREE.LatheGeometry(new THREE.SplineCurve(prof.map(([a, b]) => new THREE.Vector2(a, b))).getPoints(120).reverse(), 160);
  g.scale(1, 1, zs); const m = new THREE.Mesh(g, mat); m.position.y = y; m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
lathe([[0.0, 1.0], [0.17, 0.98], [0.17, 0.72], [0.19, 0.6], [0.28, 0.52], [0.46, 0.46], [0.6, 0.37], [0.68, 0.22], [0.7, 0.02], [0.68, -0.9]], 0.68, skin('#f3c7b1'), 0);
lathe([[0.0, 0.16], [0.28, 0.17], [0.48, 0.15], [0.62, 0.08], [0.715, -0.06], [0.72, -0.4], [0.7, -0.9]], 0.72, topMat, 0);
for (const sx of [-1, 1]) {
  const c = new THREE.CatmullRomCurve3([new THREE.Vector3(sx * 0.3, 0.14, 0.46), new THREE.Vector3(sx * 0.34, 0.36, 0.3), new THREE.Vector3(sx * 0.37, 0.46, 0.0), new THREE.Vector3(sx * 0.35, 0.36, -0.3)]);
  const st = new THREE.Mesh(new THREE.TubeGeometry(c, 48, 0.05, 16), topMat); st.scale.set(1.25, 1, 1); st.position.x = sx * -0.08; st.castShadow = true; scene.add(st);
}
for (const sx of [-1, 1]) { const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.7, 12, 32), skin('#f3c5ae')); arm.position.set(sx * 0.75, -0.25, -0.04); arm.rotation.z = sx * 0.1; arm.castShadow = arm.receiveShadow = true; scene.add(arm); }

// ---------- 머리카락 ----------
function sheet(nu, nv, fn) {
  const outer = [], inner = [], idx = [];
  for (let i = 0; i <= nu; i++) for (let j = 0; j <= nv; j++) {
    const { p, n, t } = fn(i / nu, j / nv);
    outer.push(p.clone().addScaledVector(n, t / 2)); inner.push(p.clone().addScaledVector(n, -t / 2));
  }
  const pos = [], row = nv + 1, half = (nu + 1) * row;
  for (const q of outer) pos.push(q.x, q.y, q.z);
  for (const q of inner) pos.push(q.x, q.y, q.z);
  for (let i = 0; i < nu; i++) for (let j = 0; j < nv; j++) {
    const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
    idx.push(a, c, b, b, c, d); idx.push(half + a, half + b, half + c, half + b, half + d, half + c);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx); g.computeVertexNormals();
  const m = new THREE.Mesh(g, hairMat); m.castShadow = m.receiveShadow = true; scene.add(m); return m;
}
const edge = (x, w) => Math.sqrt(Math.max(0, Math.min(1, x / w)));

// 1) 머리 전체 덩어리, 가운데 가르마
sheet(90, 240, (u, v) => {
  const phi = (v - 0.5) * Math.PI * 2, front = Math.cos(phi);
  const thMax = 0.7 + (1 - front) * 0.62;
  const th = 0.001 + u * thMax;
  const s = surfAt(dirOf(th, phi));
  const part = 0.035 * gauss(phi, 0.06) * smooth(0.65, 0.0, th);
  const off = 0.08 + 0.035 * smooth(0.7, 0.0, th) - part + 0.004 * Math.sin(phi * 6 + th * 3);
  return { p: s.p.addScaledVector(s.n, off), n: s.n, t: 0.06 * edge(1 - u, 0.08) };
});
// 2) 앞머리: 가르마에서 바깥으로 휘어 내려오는 물방울형 곡선 덩어리(길이·폭 제각각, 비대칭)
function bang(c, w, len, lift, sweep, thick, tilt = 0) {
  sheet(64, 48, (u, v) => {
    const s = 2 * v - 1;
    const taper = 1 - 0.32 * smooth(0.5, 1, u);
    const phi = c + s * w * taper + sweep * u * u + tilt * s * u;
    const bot = len - 0.09 * s * s;
    const top = 0.1 + 0.05 * Math.abs(c);
    const th = top + u * (bot - top);
    const sp = surfAt(dirOf(th, phi));
    const curl = 0.055 * smooth(0.75, 1, u);
    const belly = 0.035 * (1 - s * s) * Math.sin(Math.PI * Math.min(1, u * 1.1));
    const t = thick * edge(1 - u, 0.22) * edge(1 - Math.abs(s), 0.45);
    return { p: sp.p.addScaledVector(sp.n, lift + belly - curl), n: sp.n, t };
  });
}
bang(-0.5, 0.38, 1.3, 0.075, -0.16, 0.09);
bang(0.46, 0.36, 1.27, 0.075, 0.18, 0.09);
bang(-0.04, 0.26, 1.22, 0.07, 0.04, 0.08);
bang(-0.2, 0.2, 1.38, 0.112, -0.2, 0.09, -0.05);
bang(0.15, 0.17, 1.33, 0.112, 0.22, 0.085, 0.05);
bang(0.38, 0.15, 1.43, 0.105, 0.26, 0.085);
bang(-0.62, 0.19, 1.47, 0.1, -0.24, 0.09);
bang(-0.88, 0.17, 1.56, 0.095, -0.12, 0.09);
bang(0.74, 0.2, 1.52, 0.1, 0.18, 0.09);
// 3) 옆머리: 귀 뒤로 넘어가 어깨 앞으로 S자로 흐르는 덩어리
function lock(sx, phi0, width, drop, front, thick, wobble) {
  sheet(120, 40, (u, v) => {
    const s = 2 * v - 1;
    const phi = sx * (phi0 + s * width * (1 - 0.6 * smooth(0.5, 1, u)));
    const A = surfAt(dirOf(0.8, phi)).p, B = surfAt(dirOf(1.35, phi)).p, C = surfAt(dirOf(1.85, phi)).p;
    const out = new THREE.Vector3(Math.sin(phi), 0, Math.cos(phi)).normalize();
    const D = C.clone().addScaledVector(out, 0.12).add(new THREE.Vector3(sx * 0.06, -drop * 0.4, front * 0.6));
    const E = C.clone().addScaledVector(out, 0.04).add(new THREE.Vector3(-sx * wobble, -drop * 0.75, front));
    const F = C.clone().add(new THREE.Vector3(sx * (0.03 + wobble * 0.5), -drop, front * 1.05));
    const P = new THREE.CatmullRomCurve3([A.addScaledVector(out, 0.09), B.addScaledVector(out, 0.11), C.addScaledVector(out, 0.12), D, E, F]).getPointAt(u);
    const t = thick * edge(1 - u, 0.12) * edge(1 - Math.abs(s), 0.5);
    return { p: P, n: out, t };
  });
}
lock(-1, 1.12, 0.2, 1.25, 0.32, 0.17, 0.1);
lock(1, 1.1, 0.19, 1.15, 0.3, 0.16, 0.13);
lock(-1, 1.5, 0.26, 1.45, 0.22, 0.2, 0.06);
lock(1, 1.52, 0.27, 1.5, 0.2, 0.2, 0.08);
// 4) 뒷머리
sheet(90, 160, (u, v) => {
  const phi = Math.PI + (v - 0.5) * 3.3;
  const A = surfAt(dirOf(1.3, phi)).p, C = surfAt(dirOf(2.1, phi)).p;
  const out = new THREE.Vector3(Math.sin(phi), 0, Math.cos(phi)).normalize();
  const D = C.clone().addScaledVector(out, 0.12).add(new THREE.Vector3(0, -0.8, 0)), E = C.clone().addScaledVector(out, 0.08).add(new THREE.Vector3(0, -1.6, 0));
  const P = new THREE.CatmullRomCurve3([A.addScaledVector(out, 0.07), C.addScaledVector(out, 0.1), D, E]).getPointAt(u);
  return { p: P, n: out, t: 0.14 * edge(1 - u, 0.08) };
});

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const ao = new GTAOPass(scene, cam, W, H);
ao.updateGtaoMaterial({ radius: 0.25, distanceExponent: 1.5, thickness: 1, scale: 1.1, samples: 16 });
ao.blendIntensity = 0.5;
composer.addPass(ao);
composer.addPass(new OutputPass());
composer.render();
window.__done = true;
</script>
</body></html>
